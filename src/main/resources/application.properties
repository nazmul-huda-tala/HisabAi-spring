spring.application.name=HisabAiEntity

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/HisabAiEntity
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- DevTools ---
spring.devtools.restart.enabled=true

# --- Server ---
server.port=8080

# --- JWT ---
# Replace this secret with an env var (JWT_SECRET) before deploying anywhere real.
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-key-please-32-bytes-min-xxxxxxxx}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

# --- CORS (Angular dev server) ---
app.cors.allowed-origins=http://localhost:4200

# --- Springdoc / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
